name: CI/CD - Azure App Service

on:
  # Push a master (incluye el merge de un PR a master) -> build + migraciones + deploy
  push:
    branches: [ master ]
  # PR abierto contra master -> solo compila (no toca Azure)
  pull_request:
    branches: [ master ]
  # Permite correrlo a mano desde la pestaña Actions
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: legalmanager-api   # nombre exacto de tu App Service en Azure
  DOTNET_VERSION: '10.0.x'
  SOLUTION: LegalManager.slnx
  STARTUP_PROJECT: LegalManager.Presentation
  MIGRATIONS_PROJECT: LegalManager.Infrastructure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.STARTUP_PROJECT }} --configuration Release --no-build --output ./publish

      # ---- De acá para abajo solo corre en push a master / ejecución manual ----

      - name: Instalar dotnet-ef
        if: github.event_name != 'pull_request'
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Actualizar base de datos (migraciones EF Core con reintentos para Azure SQL Paused)
        if: github.event_name != 'pull_request'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          MAX_ATTEMPTS=6
          DELAY_SECONDS=20
          ATTEMPT=1

          echo "Intentando aplicar migraciones a la base de datos..."

          until dotnet ef database update \
            --project ${{ env.MIGRATIONS_PROJECT }} \
            --startup-project ${{ env.STARTUP_PROJECT }} \
            --configuration Release \
            --no-build \
            --connection "$DB_CONNECTION_STRING"; do

            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "Error: Se agotaron los $MAX_ATTEMPTS intentos para aplicar migraciones en la base de datos."
              exit 1
            fi

            echo "Aviso: La base de datos puede estar pausada o iniciando (intento $ATTEMPT/$MAX_ATTEMPTS). Esperando ${DELAY_SECONDS}s antes de reintentar..."
            sleep $DELAY_SECONDS
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Migraciones aplicadas con éxito."

      - name: Deploy a Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
