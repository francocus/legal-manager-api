$kind: http-request
name: Listar documentos del expediente
url: "{{baseUrl}}/api/document/case/{{caseId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Respuesta es una lista', () => pm.expect(pm.response.json()).to.be.an('array'));
order: 2000